<!doctype html>
<html lang="en"><script>document.documentElement.dataset.mode = new URLSearchParams(location.search).get("mode") || "settings";</script>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Animals</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="back" aria-hidden="true"></canvas>
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="bokeh" aria-hidden="true"></canvas>

    <!-- Displacement map used by the glass surfaces to bend what's behind them. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="glass-warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="36" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <header class="top-bar">
      <div class="picker glass" id="picker" role="radiogroup" aria-label="Animal">
        <span class="thumb" aria-hidden="true"></span>
      </div>
      <button type="button" class="tweaks-toggle glass" id="tweaksToggle" aria-expanded="false" aria-controls="tweaks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" />
          <circle cx="16" cy="6" r="2" />
          <circle cx="10" cy="12" r="2" />
          <circle cx="18" cy="18" r="2" />
        </svg>
        <span>Tweaks</span>
      </button>
    </header>

    <main class="stage">
      <div class="masthead">
        <div class="clock" id="clock" aria-live="off"></div>
        <h1 class="greeting" id="greeting"></h1>
      </div>

      <form class="composer glass" id="composer" autocomplete="off">
        <div class="composer-field">
          <svg class="composer-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m15.5 15.5 5 5" />
          </svg>
          <input id="query" name="q" type="text" placeholder="Search or type a URL" aria-label="Search or type a URL" spellcheck="false" />
        </div>
        <div class="composer-row">
          <nav class="shortcuts" id="shortcuts" aria-label="Top sites"></nav>
          <button type="submit" class="send" id="send" aria-label="Search" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </form>
    </main>

    <p class="hint" id="hint" aria-live="polite"></p>

    <aside class="tweaks glass" id="tweaks" hidden aria-label="Tweaks">
      <div class="tweaks-head">
        <span class="tweaks-title">Tweaks</span>
        <div class="tweaks-actions">
          <button type="button" class="pill" id="tweaksReset">Reset</button>
          <button type="button" class="pill icon" id="tweaksClose" aria-label="Close tweaks">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </div>
      <div class="tweaks-body" id="tweaksBody"></div>
    </aside>

    <div class="app-banner glass" id="appBanner">
      Pick an animal and tweak it here. It plays after you've been idle.
      <button type="button" class="pill" id="previewBtn">Preview</button>
    </div>

    <script src="animals.js"></script>
  </body>
</html>
