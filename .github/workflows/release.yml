# Push a tag like v1.0.1 and this builds the Windows installer and attaches it to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build only. Publishing from electron-builder uploads files in parallel,
      # which can create duplicate releases for the same tag.
      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      # One step creates the release and attaches the installer.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ASCII-Animals-Setup-*.exe \
            --title "ASCII Animals ${GITHUB_REF_NAME#v}" \
            --generate-notes
